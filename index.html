<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>大学生成长网站</title>
  <meta name="description" content="每天 10 分钟，把认知变成行动。精选认知语录 + 名人访谈 + 政策风口简报。">
  <!-- Day 21：标签页上的小图标。
       不加这一行的话，浏览器会自己去找一个叫 /favicon.ico 的文件，
       找不到就报一条 404 —— Day 21 同伴验证时在控制台里看到的红字就是它。
       明写这一行之后，浏览器就不去猜了，那条 404 彻底消失。
       用 SVG（纯文本、几百字节），不引任何二进制资源，符合约束 C2 零构建。 -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="assets/style.css">
  <!-- Day 18：整页视频背景的样式单独一个文件，删掉这个 link 就等于关掉，
       不用在 style.css 里到处摘代码。（纯静态，没有构建步骤，符合约束 C2） -->
  <link rel="stylesheet" href="assets/hero-video.css">
</head>
<body>

  <!-- ============ 整页视频背景（Day 18 加） ============
       三层，从下到上：
         1. <video>   —— 视频本身，铺满整屏，循环播放，没有声音
         2. .veil     —— 压暗层，视频太亮会把白字吃没，靠这一层压住
         3. .wrap     —— 原来的正常内容，原封不动浮在上面

       ⚠️ 三个必须写对的地方，少一个就出问题：
       · muted + playsinline：浏览器只允许「静音 + 不是全屏接管」的视频自动播，
         少这两个属性，手机上会直接不播，桌面端也可能被拦。
       · aria-hidden="true" + tabindex="-1"：它是纯装饰，
         读屏软件不该念它，键盘 Tab 也不该停在它上面。
       · poster：视频有 1MB，网慢的时候先显示一张静态图，不留黑块。

       ⚠️ 更重要的：**视频读不到时，页面必须照常能用**（约束 C1）。
       这一层是纯装饰、不在 JS 的必经路径上——就算浏览器放不出来，
       它顶多是一片压暗的底色，下面的内容一个字不少。
       所以这里故意**不挂** onerror、不写任何依赖视频的脚本。 -->
  <div class="bg-video" aria-hidden="true">
    <video class="bg-video-el" id="bg-video"
           src="assets/hero-sea.mp4"
           poster="assets/hero-sea-poster.jpg"
           autoplay muted loop playsinline preload="auto" tabindex="-1"></video>
    <div class="veil"></div>
  </div>

  <div class="wrap">

    <!-- ============ 顶栏（三个视图共用） ============ -->
    <header class="topbar">
      <div class="brand">
        <!-- 图标：一本打开的书 + 向上的箭头，纯手写矢量，不引任何图标库 -->
        <span class="brand-mark" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
               stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10v16H5.5A1.5 1.5 0 0 1 4 18.5z"/>
            <path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H14v16h4.5A1.5 1.5 0 0 0 20 18.5z"/>
            <path d="M18 9.5l2-2 2 2"/>
          </svg>
        </span>
        <div>
          <h1 class="brand-name">大学生成长网站</h1>
          <p class="brand-sub">把好内容，变成行动</p>
        </div>
      </div>

      <!-- 连续天数由 app.js 从真实打卡记录现算后填进来 -->
      <div class="streak" id="streak"></div>
    </header>

    <!-- ============ 导航标签（Day 13 加） ============
         用真正的 <nav> + <a href="#/...">：不写 JS 也能跳，
         键盘能 Tab 到、能回车，浏览器「返回」键天然可用。
         哪一个是当前页，由 app.js 打上 aria-current="page"。 -->
    <nav class="tabs" id="tabs" aria-label="页面切换"></nav>

    <!-- ============ 地址提醒（Day 19 补 2 加） ============
         ⚠️ 默认是空的、藏起来的（hidden）：**只有在「当前地址不是正式网址」时**
         app.js 才会把它填上并显示。正式网址上它完全不出现，版面跟以前一模一样。

         为什么非要有这么一条：浏览器的本地存储**按网址来源隔离**，
         换了地址打开时收藏/打卡永远是空的，而页面上一点看不出来 ——
         2026-10-05 一晚上他问了三次「我的收藏没了」（三次都不是丢了）。
         页面得自己说清楚「你在哪儿、你的记录在哪儿」。 -->
    <div class="addr-warn" id="addr-warn" hidden></div>

    <!-- ============ 元信息行（三个视图共用） ============ -->
    <div class="meta-row" id="meta-row"></div>

    <!-- ============ 三个视图（Day 13） ============
         三个 <section> 都在页面里，靠 hidden 属性切换显示。
         每个视图有自己的地址：#/home、#/library、#/me
         （地址怎么算出来、怎么切，全在 app.js 里；地址认不出来时回 #/home）。 -->
    <main id="view-root">

      <!-- ---------- 视图一：今日 ---------- -->
      <section class="view" id="view-home" aria-label="今日">

        <!-- 三张统计卡 -->
        <section class="stats" id="stats" aria-label="今日概览"></section>

        <!-- 大标题 -->
        <section class="lead">
          <h2 class="lead-title">今天，该想明白什么？</h2>
          <p class="lead-sub">一句话提升认知，三件事落到行动，外加一份政策与风口简报。</p>
        </section>

        <!-- 首屏：左语录 + 右打卡 -->
        <section class="hero">
          <article class="quote-card" id="quote-card" aria-label="今日认知语录"></article>
          <aside class="action-card" id="action-card" aria-label="今日自律行动"></aside>
        </section>

        <!-- 今日一篇（Day 15 加）：一天只推一条长内容，读完算今天过完。
             ⚠️ 它跟上面的语录卡不是一回事 —— 语录是「一句话」，
             这里是「一篇要花几分钟读完的东西」。放这一层是故意的：
             **不抢首屏**（首屏留给今天该做的那三件事）。
             候选池为空时，app.js 会**整块不画**，不留空壳。 -->
        <section class="daily-read" id="daily-read" aria-label="今日一篇"></section>

        <!-- 今日热点（Day 17 加）：真实热搜，数据来自云端数据库。
             ⚠️ 它是**从云端读来的真数据**（每天 08:00 由定时任务更新），
             所以如实标出「哪一天的榜单」和「数据来源」，让人能自己核对。
             读不到时（断网 / 云端异常）整块显示一句实话，不假装有内容。
             【Day 27】显不显示由 config.js 的 hot.visible 控制，现在是 true。 -->
        <section class="hot" id="hot" aria-label="今日热点"></section>

      </section>

      <!-- ---------- 视图二：内容库 ---------- -->
      <section class="view" id="view-library" aria-label="内容库" hidden>

        <div class="view-head" id="library-head"></div>

        <!-- 四种状态对照（开发演示区，不是给用户用的功能）。
             ⚠️ Day 27 起**默认不画** —— 开关是 config.developer.libraryStateDemo。
             理由：它自己的说明文字就写着「正式产品里不会给用户看到」，
             可它对访客是可见的，还带三个按钮（读云端/空数据/读取失败），
             任何访客都能把内容库点成「读取失败」的样子。
             代码保留：它仍是排查时的对照工具，把开关改 true 就回来。
             （原来那句注释留档：PRD 8.2 待定项 7 说「这块演示区什么时候删，
               由 Jimmy 说」—— 现在只是不显示，没有删。） -->
        <div id="library-demo"></div>

        <!-- 内容库工具条（Day 27 加）：甲 = 筛选，乙 = 搜索。
             ⚠️ 它跟下面的列表是**两个容器**，故意的：
             搜索时每敲一个字都要重画列表，但不能连输入框一起重画 ——
             重画一次输入框就被重建、焦点就丢了，打到第二个字得重新点一下。
             ⚠️ 只在「真的读到内容」时才画：加载中 / 出错 / 空库时不画，
             没有内容可筛，摆一排按钮只是噪声。 -->
        <div id="library-toolbar"></div>

        <!-- 真正的内容库：三列榜单。
             ⚠️ 这一块要能画出**四种状态**（空 / 加载中 / 出错 / 正常），
             由 app.js 的 renderLibrary() 决定画哪一种。
             ⚠️ Day 27 起它还多一种情况：四列都在、但筛选/搜索把结果筛空了 ——
             那种空状态跟「本来就没收录」是两句话，见 data.js 的 libraryTools。 -->
        <div id="library-list"></div>

        <!-- 新增一条（Day 18 加）—— ⚠️ Day 27 路线A 起**已关闭**，这个容器现在是空的。
             ⚠️ 为什么保留这个空 div：config.entry.pageWrite 想重开时，
             渲染代码还需要这个落点；删掉它反而要改两处。开关理由见 config.js。
             （原注释留档：它放在榜单**后面**是故意的 —— 内容是主角，这块是维护用的小工具；
              它跟上面的榜单**不联动**：榜单读的是本地 data.js，它提交的进云端那张表，
              所以提交完必须当场把返回显示出来，不然会让人以为「点了没反应」。） -->
        <div id="library-add"></div>

      </section>

      <!-- ---------- 视图三：我的 ---------- -->
      <section class="view" id="view-me" aria-label="我的" hidden>

        <div class="view-head" id="me-head"></div>

        <!-- 我的收藏 -->
        <section class="me-sec" id="me-favorites"></section>

        <!-- 打卡记录（最近几天） -->
        <section class="me-sec" id="me-history"></section>

      </section>

    </main>

    <!-- ============ 底部（三个视图共用） ============ -->
    <footer class="foot" id="foot"></footer>

  </div>

  <!-- 加载顺序不能换：后面每个文件一开头就要用前面那个。
       云端 SDK 必须排在 db.js 前面 —— db.js 要用它挂出来的 window.WorkBuddyCloud。
       ⚠️ Day 27 起，这个 SDK **放在本地** `assets/workbuddy-cloud-sdk.js`。

       ⚠️⚠️ Day 27 改 —— 原来这一行引的是 jsdelivr CDN，今天实测**国内直连不通**
       （HTTP 000；走本机那个本地代理也 000；DNS 能解析、TCP 连不上），
       结果 SDK 加载不到 →「今日热点」和「内容库」**整块显示「没读到」**。
       页面本身不报错，只是那一块空着 —— 不专门看就不容易发现。
       改成引用本地文件后，一次满足三条：
         · 不引任何在线资源（AGENTS.md 第 4 条第 2 项 —— 原来那句 CDN 其实违规）；
         · 仍然零构建（一个本地 .js，双击 file:// 也能加载）；
         · 不再受 jsdelivr 被墙影响。
       SDK 出处：npm 官方源 @tencent-ai/workbuddy-cloud-sdk，dist-tag dev
       ＝ 0.1.3-dev.c090db7.202610050023（与原来引的 @dev **同一版本**，行为不变）；
       取包内 lib/index.global.js，**字节未改动**
       （md5 809a4a31741d0bee8d3938134a35ed2f，67,666 字节）。

       ⚠️ 踩坑记录 3（Day 17，线上实测）—— 这个最阴：
       原来在每个脚本标签**后面**跟了一小段行尾注释，结果**线上整页 JS 全不执行**
       （页面只剩空骨架），本地却看着正常。原因是浏览器把那段行尾注释的开头
       当成了脚本内容的一部分，把后面的标签结构全吞掉了。
       —— 教训：**注释一律写在脚本标签外面**，绝不要跟在它后面。
       这个坑只有「真开浏览器跑一遍线上」才看得见，规则层测不出来。 -->
  <script src="assets/workbuddy-cloud-sdk.js"></script>

  <!-- 所有常量 -->
  <script src="assets/config.js"></script>
  <!-- 【数据访问层】Day 19 从 cloud.js 拆出来的：等 SDK、建连接、查什么表取哪些列。
       全项目**唯一**跟云端数据库说话的文件（查数据库的代码就在这一个文件里）。 -->
  <script src="assets/db.js"></script>
  <!-- 【接口层】页面跟云端说好的那几句话：校验入参 / 中文提示 / 契约形状 / 编排。
       它自己不知道 SDK 长什么样，所有读写都交给上面的 db.js。 -->
  <script src="assets/cloud.js"></script>
  <!-- 所有「算」的逻辑（纯函数） -->
  <script src="assets/rules.js"></script>
  <!-- 所有数据读写（唯一碰 localStorage 的文件） -->
  <script src="assets/store.js"></script>
  <!-- 所有内容（含三个视图的名字与说明） -->
  <script src="assets/data.js"></script>
  <!-- 画到页面上 + 收点击 + 按地址切换视图 -->
  <script src="assets/app.js"></script>
</body>
</html>
